var pagesEl = document.getElementById('pages');
var navEl = document.getElementById('nav');
function render(filter){
  pagesEl.innerHTML = '';
  var list = [];
  CHAPTERS.forEach(function(c){ c[1].forEach(function(p){ list.push(p); }); });
  list.forEach(function(n){
    if (filter && filter.indexOf(n) < 0) return;
    pagesEl.appendChild(cards[n-1]);
  });
}
CHAPTERS.forEach(function(c, i){
  var b = document.createElement('button');
  b.textContent = c[0];
  b.onclick = function(){
    var bs = document.querySelectorAll('#nav button');
    for (var j=0;j<bs.length;j++) bs[j].classList.remove('active');
    b.classList.add('active');
    render(c[1]);
    window.scrollTo(0, 0);
  };
  navEl.appendChild(b);
});
function openImg(el){
  var img = el.querySelector('img');

}
function closeImg(e){
